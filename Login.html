
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buildify | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eaf0ff, #f8faff);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 410px;
      background: rgba(255,255,255,0.85);
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(40,70,130,0.12);
      border: 1px solid white;
    }

    h1 {
      color: #315fd0;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #65718a;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #dce3ef;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #477bf4;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #477bf4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:hover {
      background: #315fd0;
    }

    .secondary {
      background: #eaf0ff;
      color: #315fd0;
    }

    .secondary:hover {
      background: #dce6ff;
    }

    .links {
      text-align: center;
      margin-top: 12px;
      color: #315fd0;
      font-size: 14px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #315fd0;
      overflow-wrap: anywhere;
    }

    #dashboard {
      display: none;
      text-align: center;
    }

    #dashboard p {
      margin: 20px 0;
      color: #65718a;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="container">
    <div id="authSection">
      <h1>Buildify.</h1>
      <p class="subtitle">Welcome! Sign in to continue.</p>

      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button id="loginBtn">Login</button>
      <button id="signupBtn" class="secondary">Create Account</button>

      <p class="links" id="forgotBtn">Forgot Password?</p>
      <p id="message" aria-live="polite"></p>
    </div>

    <div id="dashboard">
      <h1>Welcome!</h1>
      <p id="userEmail"></p>
      <p>You are successfully logged in.</p>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

 
<script type="module">
  import { auth } from "./firebase.js";

  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const message = document.getElementById("message");

  const authSection = document.getElementById("authSection");
  const dashboard = document.getElementById("dashboard");

  function showMessage(text) {
    message.textContent = text;
  }

  // Create a new account
  document.getElementById("signupBtn").addEventListener("click", async () => {
    try {
      await createUserWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );
    } catch (error) {
      showMessage(error.message);
    }
  });

  // Login existing account
  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );
    } catch (error) {
      showMessage(error.message);
    }
  });

  // Forgot password
  document.getElementById("forgotBtn").addEventListener("click", async () => {
    try {
      if (!email.value.trim()) {
        showMessage("Enter your email address first.");
        return;
      }

      await sendPasswordResetEmail(auth, email.value.trim());
      showMessage("Password reset email sent. Check your inbox.");
    } catch (error) {
      showMessage(error.message);
    }
  });

  // Check login status
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "index.html";
    } else {
      authSection.style.display = "block";
      dashboard.style.display = "none";
    }
  });
</script>
</body>
</html>
